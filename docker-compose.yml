# Mongo + Qdrant + FastAPI ai-service + Node app (internal Docker network; app uses service hostnames).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - OPENAI_EMBED_MODEL=${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Full stack in Compose: Node runs in service "app"
      - NODE_APP_URL=http://app:3000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # In-stack hostname `mongo`; host dev can still use localhost:27017 via override.
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/book-recommender}
      - NODE_ENV=production
      - SECRET_KEY=${SECRET_KEY:-secret}
      - AI_SERVICE_URL=http://ai-service:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      - mongo
      - ai-service
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongo_data:
  qdrant_data:
